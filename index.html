
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kids Money</title>

    <link rel="icon" href="icon kids   money.jpeg">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="DM.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: linear-gradient(
                110deg,
                #fff000,
                #ff941b,
                #ffed40
            );
            font-family: Georgia, serif;
            color: black;
        }

        /* TITULO */

        h1 {
            font-size: 45px;
            font-weight: bold;
            margin: 5px 8px;
        }

        /* PARTE SUPERIOR */

        .top-section {
            height: 325px;
            position: relative;
            border-bottom: 3px solid black;
        }

        #PD {
            position: absolute;
            top: 85px;
            width: 100%;
            text-align: center;
            font-size: 20px;
        }

        #GF {
            position: absolute;
            top: 140px;
            left: 13%;
            width: 74%;
            height: 15px;
            accent-color: #0786ff;
            pointer-events: none;
        }

        /* FLECHA */

        .arrow-button {
            position: absolute;
            top: 162px;
            left: 8px;
            width: 100px;
            height: 102px;
            background: white;
            border: 1px solid gray;
            cursor: pointer;
        }

        .arrow-button img {
            width: 85px;
            height: 90px;
            object-fit: contain;
        }

        /* PARTE INFERIOR */

        .game-section {
            display: grid;
            grid-template-columns: 380px minmax(0, 1fr);
            gap: 12px;
            padding: 0 10px;
        }

        h2 {
            font-size: 48px;
            margin: 0;
            height: 50px;
        }

        /* STORE */

        .store {
            min-width: 0;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(2, 140px);
            gap: 7px 20px;
        }

        .product {
            position: relative;
            width: 140px;
            height: 128px;
            padding: 3px;
            background: white;
            border: 1px solid #999;
            border-radius: 3px;
            cursor: pointer;
            overflow: hidden;
        }

        .product:hover {
            border: 2px solid #ff40a0;
            transform: scale(1.03);
        }

        .product .base-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product .cutout {
            position: absolute;
            width: 75px;
            height: 85px;
            object-fit: contain;
            left: 32px;
            top: 20px;
            pointer-events: none;
        }

        /* YOUR ITEMS */

        .items-section {
            min-width: 0;
            position: relative;
        }

        .items-section h2 {
            text-align: center;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            min-height: 500px;
        }

        #ci {
            display: block;
            width: 100%;
            height: 500px;
            background: linear-gradient(
                140deg,
                #eb83b5,
                #c52e79
            );
        }

        /* ALCANCIA */

        .piggy {
            position: absolute;
            width: 300px;
            max-width: 25%;
            right: 20px;
            bottom: -190px;
            z-index: 2;
            pointer-events: none;
        }

        /* PANTALLAS PEQUEÑAS */

        @media (max-width: 750px) {

            .game-section {
                grid-template-columns: 1fr;
            }

            .products {
                grid-template-columns: repeat(2, 140px);
            }

            .items-section {
                margin-top: 25px;
            }

            #GF {
                left: 18%;
                width: 75%;
            }

            .piggy {
                position: relative;
                display: block;
                margin: 10px auto;
                max-width: 50%;
                bottom: auto;
                right: auto;
            }
        }

    </style>
</head>

<body>

    <!-- TITULO Y PORCENTAJE -->

    <div class="top-section">

        <h1>Kids Money</h1>

        <p id="PD">Porcentaje</p>

        <input
            type="range"
            id="GF"
            name="bar1"
            min="0"
            max="2000"
            value="2000"
        >

        <button class="arrow-button" onclick="UN()">
            <img src="flecha derecha.PNG" alt="Continuar">
        </button>

    </div>


    <!-- STORE Y YOUR ITEMS -->

    <div class="game-section">

        <!-- STORE -->

        <section class="store">

            <h2>Store</h2>

            <div class="products">

                <button class="product" onclick="q7()">
                    <img class="base-image" src="Ropa item.jpg">
                    <img class="cutout" src="ropa-Photoroom.png">
                </button>

                <button class="product" onclick="r8()">
                    <img class="base-image" src="KPOP itmes.png">
                    <img class="cutout" src="K POP-removebg-preview.png">
                </button>

                <button class="product" onclick="s9()">
                    <img class="base-image" src="Sultana item.png">
                    <img class="cutout" src="Sultana-Photoroom (2).png">
                </button>

                <button class="product" onclick="t10()">
                    <img class="base-image" src="Vestido item.png">
                    <img class="cutout" src="Vestido -Photoroom (3).png">
                </button>

                <button class="product" onclick="u11()">
                    <img class="base-image" src="Video juegos item.png">
                    <img class="cutout" src="video juegos-Photoroom (2) (2).png">
                </button>

                <button class="product" onclick="w12()">
                    <img class="base-image" src="carrito control remoto item.jpg">
                    <img class="cutout" src="Carrito control remoto-Photoroom (1) (1).png">
                </button>

                <button class="product" onclick="x13()">
                    <img class="base-image" src="set dibujo item.jpg">
                    <img class="cutout" src="Set de pintura-Photoroom (1).png">
                </button>

                <button class="product" onclick="y14()">
                    <img class="base-image" src="furreal item.jpg">
                    <img class="cutout" src="furreal-Photoroom (4).png">
                </button>

                <button class="product" onclick="z15()">
                    <img class="base-image" src="Bicicleta item.jpg">
                    <img class="cutout" src="Bici-Photoroom.png">
                </button>

            </div>

        </section>


        <!-- YOUR ITEMS -->

        <section class="items-section">

            <h2>Your items</h2>

            <div class="canvas-container">

                <canvas
                    id="ci"
                    width="800"
                    height="500">
                </canvas>

                <img
                    class="piggy"
                    src="Alcancia cochinito.png"
                    alt="Alcancía">

            </div>

        </section>

    </div>


    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

    <script src="BM.js"></script>

</body>
</html>
